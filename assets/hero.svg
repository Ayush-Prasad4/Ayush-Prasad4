<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Ayush Prasad: AI/ML Engineer building reliable LLM systems.</title>
  <desc id="hero-desc">AI/ML Engineer and MSc Data Science candidate at the University of Milano-Bicocca (graduating July 2027). Production-grade LLM applications, RAG systems and model-inference pipelines in Python. Open to relocation.</desc>
  <defs>
    <radialGradient id="hero-bg" cx="72%" cy="38%" r="80%"><stop offset="0" stop-color="#0F1C36"/><stop offset=".55" stop-color="#0B1426"/><stop offset="1" stop-color="#070D1A"/></radialGradient>
    <radialGradient id="hero-light-a" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#1D4ED8" stop-opacity=".6"/><stop offset="1" stop-color="#1D4ED8" stop-opacity="0"/></radialGradient>
    <radialGradient id="hero-light-b" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#3B82F6" stop-opacity=".25"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></radialGradient>
    <linearGradient id="hero-name-grad" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="420" y2="0"><stop offset="0" stop-color="#EFF6FF"/><stop offset=".55" stop-color="#93C5FD"/><stop offset="1" stop-color="#3B82F6"/></linearGradient>
    <linearGradient id="hero-sheen" gradientUnits="userSpaceOnUse" x1="-260" y1="0" x2="-40" y2="0">
      <stop offset="0" stop-color="#EFF6FF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".85"/><stop offset="1" stop-color="#EFF6FF" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;760 0;760 0" keyTimes="0;.35;1" dur="8s" begin="3s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="hero-scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#93C5FD" stop-opacity="0"/><stop offset=".5" stop-color="#93C5FD" stop-opacity=".07"/><stop offset="1" stop-color="#93C5FD" stop-opacity="0"/></linearGradient>
    <linearGradient id="hero-rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3B82F6" stop-opacity="0"/><stop offset=".2" stop-color="#93C5FD"/><stop offset=".75" stop-color="#1D4ED8"/><stop offset="1" stop-color="#1D4ED8" stop-opacity="0"/></linearGradient>
    <radialGradient id="hero-core" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="#3B82F6"/><stop offset=".6" stop-color="#1D4ED8"/><stop offset="1" stop-color="#1E3A8A"/></radialGradient>
    <pattern id="hero-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#3B82F6" stroke-opacity=".08" stroke-width="1"/></pattern>
    <radialGradient id="hero-grid-fade" cx="76%" cy="48%" r="55%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
    <mask id="hero-grid-mask"><rect width="1200" height="480" fill="url(#hero-grid-fade)"/></mask>
    <filter id="hero-glow" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="hero-clip"><rect width="1200" height="480" rx="20"/></clipPath>
  </defs>
  <style>
    .hero-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .hero-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .hero-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }

    .hero-rise { animation: hero-rise 1.4s cubic-bezier(.16,1,.3,1) both; }
    .hero-fade { animation: hero-fade 1.6s cubic-bezier(.16,1,.3,1) both; }
    .d1 { animation-delay: .15s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .6s; }
    .d4 { animation-delay: .9s; } .d5 { animation-delay: 1.2s; } .d6 { animation-delay: 1.5s; }
    .hero-draw { stroke-dasharray: 900; stroke-dashoffset: 900; animation: hero-draw 2.4s cubic-bezier(.65,0,.35,1) .9s forwards; }
    .hero-signal { stroke-dasharray: 700; stroke-dashoffset: 700; animation: hero-draw 2.2s cubic-bezier(.65,0,.35,1) 2.2s forwards; }
    @keyframes hero-rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    @keyframes hero-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes hero-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .hero-rise, .hero-fade { animation: none; }
      .hero-draw, .hero-signal { animation: none; stroke-dashoffset: 0; }
    }
  </style>
  <g clip-path="url(#hero-clip)">
    <rect width="1200" height="480" fill="url(#hero-bg)"/>
    <ellipse cx="900" cy="140" rx="420" ry="300" fill="url(#hero-light-a)"><animateTransform attributeName="transform" type="translate" values="0 0; -60 30; 0 0" dur="22s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/></ellipse>
    <ellipse cx="180" cy="460" rx="360" ry="220" fill="url(#hero-light-b)"><animateTransform attributeName="transform" type="translate" values="0 0; 70 -25; 0 0" dur="28s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/></ellipse>
    <rect width="1200" height="480" fill="url(#hero-grid)" mask="url(#hero-grid-mask)"/>
    <rect x="0" y="-140" width="1200" height="140" fill="url(#hero-scan)"><animate attributeName="y" values="-140;480" dur="11s" begin="2s" repeatCount="indefinite"/></rect>
    <g fill="#93C5FD">
      <circle cx="851" cy="137" r="1.3"><animate attributeName="opacity" values="0;.9;0" dur="4.1s" begin="2.5s" repeatCount="indefinite"/><animate attributeName="cy" values="137;111" dur="4.1s" begin="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="616" cy="247" r="1.4"><animate attributeName="opacity" values="0;.9;0" dur="6.3s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="cy" values="247;221" dur="6.3s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="608" cy="282" r="1.3"><animate attributeName="opacity" values="0;.9;0" dur="4.6s" begin="1.7s" repeatCount="indefinite"/><animate attributeName="cy" values="282;256" dur="4.6s" begin="1.7s" repeatCount="indefinite"/></circle>
      <circle cx="580" cy="349" r="1.1"><animate attributeName="opacity" values="0;.9;0" dur="4.6s" begin="1.9s" repeatCount="indefinite"/><animate attributeName="cy" values="349;323" dur="4.6s" begin="1.9s" repeatCount="indefinite"/></circle>
      <circle cx="583" cy="355" r="1.4"><animate attributeName="opacity" values="0;.9;0" dur="4.1s" begin="0.7s" repeatCount="indefinite"/><animate attributeName="cy" values="355;329" dur="4.1s" begin="0.7s" repeatCount="indefinite"/></circle>
      <circle cx="1090" cy="128" r="1.2"><animate attributeName="opacity" values="0;.9;0" dur="4.4s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="cy" values="128;102" dur="4.4s" begin="0.4s" repeatCount="indefinite"/></circle>
      <circle cx="835" cy="346" r="1.6"><animate attributeName="opacity" values="0;.9;0" dur="4.5s" begin="1.7s" repeatCount="indefinite"/><animate attributeName="cy" values="346;320" dur="4.5s" begin="1.7s" repeatCount="indefinite"/></circle>
      <circle cx="712" cy="250" r="1.1"><animate attributeName="opacity" values="0;.9;0" dur="5.8s" begin="1.7s" repeatCount="indefinite"/><animate attributeName="cy" values="250;224" dur="5.8s" begin="1.7s" repeatCount="indefinite"/></circle>
      <circle cx="730" cy="314" r="1.5"><animate attributeName="opacity" values="0;.9;0" dur="5.1s" begin="0.9s" repeatCount="indefinite"/><animate attributeName="cy" values="314;288" dur="5.1s" begin="0.9s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Orbit: the layers I work across -->
    <g transform="translate(920 232)" class="hero-fade d4">
      <circle r="190" fill="none" stroke="#3B82F6" stroke-opacity=".12"/>
      <circle r="140" fill="none" stroke="#93C5FD" stroke-opacity=".28" stroke-dasharray="2 6"/>
      <circle r="76" fill="none" stroke="#3B82F6" stroke-opacity=".25"/>
      <g stroke="#3B82F6" stroke-opacity=".16" stroke-dasharray="3 5">
        <line x1="0" y1="0" x2="0.0" y2="-140.0"/>
        <line x1="0" y1="0" x2="133.1" y2="-43.3"/>
        <line x1="0" y1="0" x2="82.3" y2="113.3"/>
        <line x1="0" y1="0" x2="-82.3" y2="113.3"/>
        <line x1="0" y1="0" x2="-133.1" y2="-43.3"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="70s" repeatCount="indefinite"/>
        <circle cx="140" cy="0" r="3.5" fill="#93C5FD" filter="url(#hero-glow)"/>
        <circle cx="-99" cy="-99" r="2" fill="#3B82F6"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="46s" repeatCount="indefinite"/>
        <circle cx="76" cy="0" r="2.6" fill="#38BDF8" filter="url(#hero-glow)"/>
      </g>
      <circle r="46" fill="url(#hero-core)" stroke="#93C5FD" stroke-opacity=".55" filter="url(#hero-glow)"/>
      <text class="hero-serif" y="12" text-anchor="middle" font-size="34" font-style="italic" fill="#EFF6FF">AP</text>
      <g class="hero-mono" font-size="10.5" letter-spacing="1.6" fill="#9FB3D1">
        <g transform="translate(0.0 -140.0)"><circle r="3.4" fill="#3B82F6"/><circle r="7" fill="none" stroke="#3B82F6" stroke-opacity=".35"/><text x="0" y="-14" text-anchor="middle">RAG</text></g>
        <g transform="translate(133.1 -43.3)"><circle r="3.4" fill="#3B82F6"/><circle r="7" fill="none" stroke="#3B82F6" stroke-opacity=".35"/><text x="12" y="4">AGENTS</text></g>
        <g transform="translate(82.3 113.3)"><circle r="3.4" fill="#3B82F6"/><circle r="7" fill="none" stroke="#3B82F6" stroke-opacity=".35"/><text x="12" y="4">INFERENCE</text></g>
        <g transform="translate(-82.3 113.3)"><circle r="3.4" fill="#3B82F6"/><circle r="7" fill="none" stroke="#3B82F6" stroke-opacity=".35"/><text x="-12" y="4" text-anchor="end">EVALS</text></g>
        <g transform="translate(-133.1 -43.3)"><circle r="3.4" fill="#3B82F6"/><circle r="7" fill="none" stroke="#3B82F6" stroke-opacity=".35"/><text x="-12" y="4" text-anchor="end">SECURITY</text></g>
      </g>
    </g>

    <path class="hero-signal" d="M600 342 C 680 342, 740 262, 787 189" fill="none" stroke="#3B82F6" stroke-opacity=".5" stroke-width="1.2"/>
    <circle cx="600" cy="342" r="3" fill="#EFF6FF" filter="url(#hero-glow)" opacity=".9">
      <animateMotion dur="5s" repeatCount="indefinite" begin="4.4s" path="M600 342 C 680 342, 740 262, 787 189" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines=".45 0 .55 1"/>
    </circle>

    <g class="hero-fade d1" transform="translate(72 64)">
      <rect width="322" height="34" rx="17" fill="#0B1426" stroke="#3B82F6" stroke-opacity=".3"/>
      <circle cx="20" cy="17" r="4" fill="#3B82F6"><animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <text class="hero-mono" x="34" y="21.5" font-size="12" fill="#9FB3D1">~/ayush<tspan fill="#3B82F6"> $ </tspan><tspan fill="#EFF6FF">build --reliable-ai</tspan></text>
      <rect x="300" y="10" width="7" height="14" fill="#93C5FD"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1.1s" repeatCount="indefinite"/></rect>
    </g>

    <g class="hero-rise d2">
      <line x1="72" y1="136" x2="104" y2="136" stroke="#3B82F6"/>
      <text class="hero-mono" x="116" y="140" font-size="12.5" letter-spacing="3.4" fill="#3B82F6">AI · LLM SYSTEMS · INFERENCE</text>
    </g>

    <text class="hero-serif hero-rise d3" x="68" y="230" font-size="92" font-weight="300" letter-spacing="-2.5" fill="#EFF6FF">Ayush</text>
    <text class="hero-serif hero-rise d4" x="68" y="318" font-size="92" font-style="italic" font-weight="300" letter-spacing="-2.5" fill="url(#hero-name-grad)">Prasad<tspan fill="#3B82F6">.</tspan></text>
    <g class="hero-fade d6" pointer-events="none">
      <text class="hero-serif" x="68" y="230" font-size="92" font-weight="300" letter-spacing="-2.5" fill="url(#hero-sheen)">Ayush</text>
      <text class="hero-serif" x="68" y="318" font-size="92" font-style="italic" font-weight="300" letter-spacing="-2.5" fill="url(#hero-sheen)">Prasad.</text>
    </g>

    <path class="hero-draw" d="M72 346 C 220 340, 420 352, 600 342" fill="none" stroke="url(#hero-rule)" stroke-width="2" stroke-linecap="round" filter="url(#hero-glow)"/>

    <text class="hero-mono hero-rise d5" x="72" y="384" font-size="13" letter-spacing="2.6" fill="#EFF6FF">AI/ML ENGINEER  ·  LLM &amp; RAG SYSTEMS  ·  INFERENCE</text>
    <text class="hero-serif hero-rise d6" x="72" y="420" font-size="19" font-style="italic" fill="#9FB3D1">LLM systems with evaluation, security and reliability built in.</text>

    <g class="hero-fade d6">
      <line x1="72" y1="446" x2="1128" y2="446" stroke="#3B82F6" stroke-opacity=".16"/>
      <text class="hero-mono" x="72" y="466" font-size="10.5" letter-spacing="2" fill="#9FB3D1">MSC DATA SCIENCE · UNIVERSITY OF MILANO-BICOCCA · EXP. JUL 2027</text>
      <text class="hero-mono" x="1128" y="466" text-anchor="end" font-size="10.5" letter-spacing="2" fill="#93C5FD">OPEN TO RELOCATION · EUROPE</text>
    </g>
    <rect x=".5" y=".5" width="1199" height="479" rx="19.5" fill="none" stroke="#3B82F6" stroke-opacity=".2"/>
  </g>
</svg>

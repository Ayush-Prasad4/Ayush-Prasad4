<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="ce-t ce-d">
  <title id="ce-t">Credentials</title>
  <desc id="ce-d">MSc Data Science at the University of Milano-Bicocca, October 2025 to July 2027 (expected). B.Tech Computer Science and Engineering at Siksha 'O' Anusandhan, 2020 to 2024. Machine Learning Specialization by DeepLearning.AI and Stanford. Co-author of an IEEE paper submission on machine learning and multi-task and meta-learning. English C1, German A1. Open to relocation.</desc>
  <defs>
    <linearGradient id="ce-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1426"/><stop offset="1" stop-color="#070D1A"/></linearGradient>
    <radialGradient id="ce-glow" cx="15%" cy="100%" r="70%"><stop offset="0" stop-color="#1D4ED8" stop-opacity=".45"/><stop offset="1" stop-color="#1E3A8A" stop-opacity="0"/></radialGradient>
    <linearGradient id="ce-edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EFF6FF"/><stop offset=".5" stop-color="#93C5FD"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    .ce-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .ce-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .ce-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }

    .ce-tile { animation: ce-in 1s cubic-bezier(.34,1.3,.64,1) both; }
    .ce-edge { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: ce-edge 6s cubic-bezier(.65,0,.35,1) infinite; }
    @keyframes ce-in { from { opacity: 0; transform: translateY(18px) scale(.97); } to { opacity: 1; transform: none; } }
    @keyframes ce-edge { 0% { stroke-dashoffset: 1000; opacity: 1; } 40% { stroke-dashoffset: 0; opacity: 1; } 60%, 100% { stroke-dashoffset: 0; opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .ce-tile { animation: none; } .ce-edge { display: none; } }
  </style>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p4-t p4-d">
  <title id="p4-t">LifePilot: native iOS productivity app with AI-assisted workflows.</title>
  <desc id="p4-d">SwiftUI productivity application in development with task and calendar management, PDF document library, PDFKit, Vision OCR, and AI-assisted document and chat workflows.</desc>
  <defs>
    <linearGradient id="p4-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1426"/><stop offset="1" stop-color="#070D1A"/></linearGradient>
    <radialGradient id="p4-glow" cx="82%" cy="30%" r="55%"><stop offset="0" stop-color="#1D4ED8" stop-opacity=".6"/><stop offset="1" stop-color="#1E3A8A" stop-opacity="0"/></radialGradient>
    <pattern id="p4-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#3B82F6" stroke-opacity=".08"/></pattern>
    <clipPath id="p4-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="p4-trace" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EFF6FF"/><stop offset=".45" stop-color="#93C5FD"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    .p4-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p4-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p4-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .p4-in { animation: p4-in 1s cubic-bezier(.16,1,.3,1) both; }
    .p4-trace { stroke-dasharray: 564 3136; stroke-dashoffset: 3700; animation: p4-trace 7s linear infinite; }
    @keyframes p4-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes p4-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p4-in { animation: none; } .p4-trace { display: none; } }
  </style>
  <g clip-path="url(#p4-clip)">
    <rect width="1200" height="370" fill="url(#p4-bg)"/><rect x="720" width="480" height="370" fill="url(#p4-grid)"/><rect width="1200" height="370" fill="url(#p4-glow)"/>
    <g class="p4-in">
      <text class="p4-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#3B82F6">04 · NATIVE iOS · PRODUCTIVITY · AI</text>
      <text class="p4-serif" x="54" y="126" font-size="52" font-weight="300" letter-spacing="-1.5" fill="#EFF6FF">LifePilot</text>
      <text class="p4-sans" x="56" y="166" font-size="17" fill="#9FB3D1">A focused workspace for tasks, documents and ideas.</text>
      <text class="p4-mono" x="56" y="200" font-size="12.5" fill="#93C5FD"><tspan fill="#3B82F6">BUILDING ›</tspan> native iOS experience with AI-assisted workflows</text>
      <line x1="56" y1="226" x2="680" y2="226" stroke="#3B82F6" stroke-opacity=".32"/>
      <g transform="translate(56 256)"><text class="p4-serif" font-size="29" font-weight="300" fill="#EFF6FF">SwiftUI</text><text class="p4-sans" y="22" font-size="12.5" fill="#9FB3D1">native iOS interface</text><text class="p4-sans" y="38" font-size="12" fill="#9FB3D1" fill-opacity=".75">MVVM architecture</text></g>
      <g transform="translate(261 256)"><text class="p4-serif" font-size="29" font-weight="300" fill="#EFF6FF">PDF + OCR</text><text class="p4-sans" y="22" font-size="12.5" fill="#9FB3D1">document intelligence</text><text class="p4-sans" y="38" font-size="12" fill="#9FB3D1" fill-opacity=".75">PDFKit · Vision</text></g>
      <g transform="translate(466 256)"><text class="p4-serif" font-size="29" font-weight="300" fill="#EFF6FF">AI Assist</text><text class="p4-sans" y="22" font-size="12.5" fill="#9FB3D1">document and chat flows</text><text class="p4-sans" y="38" font-size="12" fill="#9FB3D1" fill-opacity=".75">in active development</text></g>
      <g><rect x="56" y="322" width="82" height="26" rx="13" fill="#10203F" stroke="#3B82F6" stroke-opacity=".38"/><text class="p4-mono" x="97" y="339" text-anchor="middle" font-size="11.5" fill="#93C5FD">SwiftUI</text></g>
      <g><rect x="146" y="322" width="69" height="26" rx="13" fill="#10203F" stroke="#3B82F6" stroke-opacity=".38"/><text class="p4-mono" x="180.5" y="339" text-anchor="middle" font-size="11.5" fill="#93C5FD">PDFKit</text></g>
      <g><rect x="223" y="322" width="69" height="26" rx="13" fill="#10203F" stroke="#3B82F6" stroke-opacity=".38"/><text class="p4-mono" x="257.5" y="339" text-anchor="middle" font-size="11.5" fill="#93C5FD">Vision</text></g>
      <g><rect x="300" y="322" width="94" height="26" rx="13" fill="#10203F" stroke="#3B82F6" stroke-opacity=".38"/><text class="p4-mono" x="347" y="339" text-anchor="middle" font-size="11.5" fill="#93C5FD">Persistence</text></g>
    </g>
    <g class="p4-in">
      <rect x="850" y="38" width="280" height="294" rx="30" fill="#070D1A" stroke="#3B82F6" stroke-opacity=".55" stroke-width="1.5"/>
      <rect x="862" y="50" width="256" height="270" rx="21" fill="#0B1426" stroke="#3B82F6" stroke-opacity=".2"/>
      <rect x="950" y="58" width="80" height="14" rx="7" fill="#070D1A"/>
      <text class="p4-mono" x="884" y="95" font-size="10" letter-spacing="1.6" fill="#3B82F6">TODAY · YOUR SPACE</text>
      <text class="p4-serif" x="884" y="125" font-size="25" fill="#EFF6FF">Good focus.</text>
      <rect x="882" y="145" width="216" height="48" rx="9" fill="#10203F" stroke="#3B82F6" stroke-opacity=".35"/><circle cx="899" cy="169" r="5" fill="#93C5FD"/><text class="p4-sans" x="912" y="166" font-size="11.5" fill="#EFF6FF">Review priorities</text><text class="p4-sans" x="912" y="181" font-size="10" fill="#9FB3D1">Task management</text>
      <rect x="882" y="201" width="216" height="48" rx="9" fill="#10203F" stroke="#3B82F6" stroke-opacity=".35"/><rect x="894" y="215" width="12" height="16" rx="2" fill="none" stroke="#93C5FD"/><path d="M897 220h6m-6 4h6" stroke="#93C5FD"/><text class="p4-sans" x="916" y="222" font-size="11.5" fill="#EFF6FF">Read a document</text><text class="p4-sans" x="916" y="237" font-size="10" fill="#9FB3D1">PDF · OCR · AI assist</text>
      <rect x="882" y="257" width="216" height="43" rx="9" fill="#10203F" stroke="#3B82F6" stroke-opacity=".35"/><path d="M897 273h12m-12 5h8m-8 5h10" stroke="#93C5FD" stroke-width="1.5" stroke-linecap="round"/><text class="p4-sans" x="920" y="277" font-size="11.5" fill="#EFF6FF">Assistant</text><text class="p4-sans" x="920" y="290" font-size="10" fill="#9FB3D1">Plan · ask · organize</text>
      <text class="p4-mono" x="990" y="350" text-anchor="middle" font-size="10" letter-spacing="1.6" fill="#93C5FD">CONCEPTUAL UI · IN DEVELOPMENT</text>
    </g>
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#3B82F6" stroke-opacity=".22"/><rect class="p4-trace" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#p4-trace)" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>

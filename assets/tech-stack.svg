<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="tc-title tc-desc">
  <title id="tc-title">Tech stack</title>
  <desc id="tc-desc">Languages and backend: Python, SQL, FastAPI, Pydantic, PostgreSQL, Redis, Pytest. GenAI and agents: LLMs, RAG with hybrid dense and BM25 retrieval, LangChain, LangGraph, structured outputs, RAG and agent evaluation, OWASP LLM Top 10. ML and inference: PyTorch, Hugging Face Transformers, ONNX Runtime, INT8 quantization, FP16/BF16, dynamic batching, benchmarking. MLOps and cloud: Docker, Git, GitHub Actions, Prometheus, Grafana, Locust, AWS. Data and ML: Scikit-learn, Pandas, NumPy, time-series forecasting. Evaluation and security: golden sets, sealed test splits, red-team harness, regression tests in CI.</desc>
  <defs>
    <linearGradient id="tc-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1426"/><stop offset="1" stop-color="#070D1A"/></linearGradient>
    <radialGradient id="tc-glow" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#1E3A8A" stop-opacity=".85"/><stop offset="1" stop-color="#1E3A8A" stop-opacity="0"/></radialGradient>
    <radialGradient id="tc-pulse"><stop offset="0" stop-color="#EFF6FF"/><stop offset=".5" stop-color="#93C5FD" stop-opacity=".6"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></radialGradient>
    <linearGradient id="tc-trace" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EFF6FF"/><stop offset=".45" stop-color="#93C5FD"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    .tc-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .tc-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .tc-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }

    .tc-panel { animation: tc-in 1.1s cubic-bezier(.16,1,.3,1) both; }
    .tc-p1 { animation-delay: .05s; } .tc-p2 { animation-delay: .2s; } .tc-p3 { animation-delay: .35s; }
    .tc-p4 { animation-delay: .5s; } .tc-p5 { animation-delay: .65s; } .tc-p6 { animation-delay: .8s; }
    .tc-web { stroke-dasharray: 1800; stroke-dashoffset: 1800; animation: tc-draw 3s cubic-bezier(.65,0,.35,1) 1s forwards; }
    .tc-trace { stroke-dasharray: 201 1120; stroke-dashoffset: 1321; animation: tc-trace 7s linear infinite; }
    @keyframes tc-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes tc-draw { to { stroke-dashoffset: 0; } }
    @keyframes tc-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .tc-panel { animation: none; } .tc-web { animation: none; stroke-dashoffset: 0; } .tc-trace { display: none; } }
  </style>
  <rect width="1200" height="500" rx="20" fill="url(#tc-bg)"/>
  <rect width="1200" height="500" rx="20" fill="url(#tc-glow)"/>
  <rect x=".5" y=".5" width="1199" height="499" rx="19.5" fill="none" stroke="#3B82F6" stroke-opacity=".18"/>
  <path class="tc-web" d="M24 250 H1176 M406 24 V476 M794 24 V476" fill="none" stroke="#3B82F6" stroke-opacity=".22"/>
  <circle cx="0" cy="250" r="8" fill="url(#tc-pulse)" opacity="0">
    <animate attributeName="cx" values="24;1176" dur="9s" begin="3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="9s" begin="3s" repeatCount="indefinite"/>
  </circle>
  <g fill="#070D1A" stroke="#93C5FD">
    <rect x="400" y="244" width="12" height="12" transform="rotate(45 406 250)"/>
    <rect x="788" y="244" width="12" height="12" transform="rotate(45 794 250)"/>
  </g>
  
  <g class="tc-panel tc-p1"><g transform="translate(32 32)">
    <rect width="360" height="200" rx="14" fill="#0B1426" fill-opacity=".85" stroke="#3B82F6" stroke-opacity=".24"/>
    <rect class="tc-trace" style="animation-delay:0.00s" width="360" height="200" rx="14" fill="none" stroke="url(#tc-trace)" stroke-width="1.4" stroke-linecap="round"/>
    <text class="tc-mono" x="24" y="38" font-size="11" letter-spacing="2.4" fill="#3B82F6">01  LANGUAGES &amp; BACKEND</text>
    <text class="tc-serif" x="24" y="96" font-size="40" font-weight="300" fill="#EFF6FF">Python<tspan font-size="13" class="tc-mono" fill="#3B82F6" dx="8" dy="-18">PRIMARY</tspan></text>
    <text class="tc-sans" x="24" y="132" font-size="13.5" fill="#9FB3D1">SQL · FastAPI · Pydantic</text><text class="tc-sans" x="24" y="156" font-size="13.5" fill="#9FB3D1">PostgreSQL · Redis · Pytest</text>
  </g></g>
  <g class="tc-panel tc-p2"><g transform="translate(420 32)">
    <rect width="360" height="200" rx="14" fill="#0B1426" fill-opacity=".85" stroke="#3B82F6" stroke-opacity=".24"/>
    <rect class="tc-trace" style="animation-delay:1.10s" width="360" height="200" rx="14" fill="none" stroke="url(#tc-trace)" stroke-width="1.4" stroke-linecap="round"/>
    <text class="tc-mono" x="24" y="38" font-size="11" letter-spacing="2.4" fill="#3B82F6">02  GENAI &amp; AGENTS</text>
    <text class="tc-serif" x="24" y="96" font-size="40" font-weight="300" fill="#EFF6FF">LangGraph</text>
    <text class="tc-sans" x="24" y="132" font-size="13.5" fill="#9FB3D1">LLMs · RAG (hybrid dense + BM25) · LangChain</text><text class="tc-sans" x="24" y="156" font-size="13.5" fill="#9FB3D1">structured outputs</text><text class="tc-sans" x="24" y="180" font-size="13.5" fill="#9FB3D1">RAG / agent evaluation · OWASP LLM Top 10</text>
  </g></g>
  <g class="tc-panel tc-p3"><g transform="translate(808 32)">
    <rect width="360" height="200" rx="14" fill="#0B1426" fill-opacity=".85" stroke="#3B82F6" stroke-opacity=".24"/>
    <rect class="tc-trace" style="animation-delay:2.20s" width="360" height="200" rx="14" fill="none" stroke="url(#tc-trace)" stroke-width="1.4" stroke-linecap="round"/>
    <text class="tc-mono" x="24" y="38" font-size="11" letter-spacing="2.4" fill="#3B82F6">03  ML &amp; INFERENCE</text>
    <text class="tc-serif" x="24" y="96" font-size="40" font-weight="300" fill="#EFF6FF">PyTorch</text>
    <text class="tc-sans" x="24" y="132" font-size="13.5" fill="#9FB3D1">Hugging Face Transformers · ONNX Runtime</text><text class="tc-sans" x="24" y="156" font-size="13.5" fill="#9FB3D1">INT8 quantization · FP16/BF16</text><text class="tc-sans" x="24" y="180" font-size="13.5" fill="#9FB3D1">dynamic batching · benchmarking</text>
  </g></g>
  <g class="tc-panel tc-p4"><g transform="translate(32 268)">
    <rect width="360" height="200" rx="14" fill="#0B1426" fill-opacity=".85" stroke="#3B82F6" stroke-opacity=".24"/>
    <rect class="tc-trace" style="animation-delay:3.30s" width="360" height="200" rx="14" fill="none" stroke="url(#tc-trace)" stroke-width="1.4" stroke-linecap="round"/>
    <text class="tc-mono" x="24" y="38" font-size="11" letter-spacing="2.4" fill="#3B82F6">04  MLOPS &amp; CLOUD</text>
    <text class="tc-serif" x="24" y="96" font-size="40" font-weight="300" fill="#EFF6FF">Docker</text>
    <text class="tc-sans" x="24" y="132" font-size="13.5" fill="#9FB3D1">Git · GitHub Actions · AWS</text><text class="tc-sans" x="24" y="156" font-size="13.5" fill="#9FB3D1">Prometheus · Grafana · Locust</text>
  </g></g>
  <g class="tc-panel tc-p5"><g transform="translate(420 268)">
    <rect width="360" height="200" rx="14" fill="#0B1426" fill-opacity=".85" stroke="#3B82F6" stroke-opacity=".24"/>
    <rect class="tc-trace" style="animation-delay:4.40s" width="360" height="200" rx="14" fill="none" stroke="url(#tc-trace)" stroke-width="1.4" stroke-linecap="round"/>
    <text class="tc-mono" x="24" y="38" font-size="11" letter-spacing="2.4" fill="#3B82F6">05  DATA &amp; ML</text>
    <text class="tc-serif" x="24" y="96" font-size="40" font-weight="300" fill="#EFF6FF">Scikit-learn</text>
    <text class="tc-sans" x="24" y="132" font-size="13.5" fill="#9FB3D1">Pandas · NumPy</text><text class="tc-sans" x="24" y="156" font-size="13.5" fill="#9FB3D1">time-series forecasting</text>
  </g></g>
  <g class="tc-panel tc-p6"><g transform="translate(808 268)">
    <rect width="360" height="200" rx="14" fill="#0B1426" fill-opacity=".85" stroke="#3B82F6" stroke-opacity=".24"/>
    <rect class="tc-trace" style="animation-delay:5.50s" width="360" height="200" rx="14" fill="none" stroke="url(#tc-trace)" stroke-width="1.4" stroke-linecap="round"/>
    <text class="tc-mono" x="24" y="38" font-size="11" letter-spacing="2.4" fill="#3B82F6">06  EVALUATION &amp; SECURITY</text>
    <text class="tc-serif" x="24" y="96" font-size="40" font-weight="300" fill="#EFF6FF">Evals</text>
    <text class="tc-sans" x="24" y="132" font-size="13.5" fill="#9FB3D1">golden sets · sealed test splits</text><text class="tc-sans" x="24" y="156" font-size="13.5" fill="#9FB3D1">red-team harness · prompt-injection tests</text><text class="tc-sans" x="24" y="180" font-size="13.5" fill="#9FB3D1">regression tests in CI</text>
  </g></g>
</svg>

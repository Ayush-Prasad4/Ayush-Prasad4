<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p2-t">
  <title id="p2-t">InferX: AI inference optimization platform, about 10 times faster DistilBERT latency.</title>
  <defs>
    <linearGradient id="p2-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1426"/><stop offset="1" stop-color="#070D1A"/></linearGradient>
    <radialGradient id="p2-glow" cx="82%" cy="30%" r="55%"><stop offset="0" stop-color="#1D4ED8" stop-opacity=".6"/><stop offset="1" stop-color="#1E3A8A" stop-opacity="0"/></radialGradient>
    <pattern id="p2-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#3B82F6" stroke-opacity=".08"/></pattern>
    <filter id="p2-glowf" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="p2-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="p2-trace" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EFF6FF"/><stop offset=".45" stop-color="#93C5FD"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    .p2-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p2-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p2-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }

    .p2-in { animation: p2-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .p2-d1 { animation-delay: .15s; } .p2-d2 { animation-delay: .4s; }
    .p2-chip { animation: p2-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    .p2-draw { stroke-dasharray: 700; stroke-dashoffset: 700; animation: p2-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    .p2-trace { stroke-dasharray: 564 3136; stroke-dashoffset: 3700; animation: p2-trace 7s linear infinite; }
    @keyframes p2-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes p2-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes p2-draw { to { stroke-dashoffset: 0; } }
    @keyframes p2-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p2-in, .p2-chip { animation: none; } .p2-draw { animation: none; stroke-dashoffset: 0; } .p2-trace { display: none; } }
  </style>
  <g clip-path="url(#p2-clip)">
    <rect width="1200" height="370" fill="url(#p2-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#p2-grid)"/>
    <rect width="1200" height="370" fill="url(#p2-glow)"/>
    <g class="p2-in p2-d1">
      <text class="p2-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#3B82F6">02 · INFERENCE · OPTIMIZATION · MLOPS</text>
      <text class="p2-serif" x="54" y="126" font-size="52" font-weight="300" letter-spacing="-1.5" fill="#EFF6FF">InferX</text>
      <text class="p2-sans" x="56" y="166" font-size="17" fill="#9FB3D1">Faster Transformer and LLM inference, measured end to end.</text>
      <text class="p2-mono" x="56" y="200" font-size="12.5" fill="#93C5FD"><tspan fill="#3B82F6">BUILT ›</tspan> optimize → serve → benchmark → monitor Transformer and LLM workloads</text>
      <line class="p2-draw" x1="56" y1="226" x2="680" y2="226" stroke="#3B82F6" stroke-opacity=".32"/>
      
    <g transform="translate(56 256)"><text class="p2-serif" font-size="34" font-weight="300" fill="#EFF6FF">≈10×</text><text class="p2-sans" y="22" font-size="12.5" fill="#9FB3D1">faster DistilBERT latency</text><text class="p2-sans" y="38" font-size="12" fill="#9FB3D1" fill-opacity=".75">14.96 ms → 1.53 ms (INT8)</text></g>
    <g transform="translate(261 256)"><text class="p2-serif" font-size="34" font-weight="300" fill="#EFF6FF">+49%</text><text class="p2-sans" y="22" font-size="12.5" fill="#9FB3D1">Qwen2.5-0.5B throughput</text><text class="p2-sans" y="38" font-size="12" fill="#9FB3D1" fill-opacity=".75">with FP16</text></g>
    <g transform="translate(466 256)"><text class="p2-serif" font-size="34" font-weight="300" fill="#EFF6FF">0%</text><text class="p2-sans" y="22" font-size="12.5" fill="#9FB3D1">failed requests</text><text class="p2-sans" y="38" font-size="12" fill="#9FB3D1" fill-opacity=".75">1,674-request AWS load test</text></g>
      <g class="p2-chip" style="animation-delay:1.00s"><rect x="56" y="322" width="76" height="26" rx="13" fill="#10203F" stroke="#3B82F6" stroke-opacity=".38"/><text class="p2-mono" x="94.0" y="339" text-anchor="middle" font-size="11.5" fill="#93C5FD">PyTorch</text></g><g class="p2-chip" style="animation-delay:1.12s"><rect x="140" y="322" width="112" height="26" rx="13" fill="#10203F" stroke="#3B82F6" stroke-opacity=".38"/><text class="p2-mono" x="196.0" y="339" text-anchor="middle" font-size="11.5" fill="#93C5FD">ONNX Runtime</text></g><g class="p2-chip" style="animation-delay:1.24s"><rect x="260" y="322" width="76" height="26" rx="13" fill="#10203F" stroke="#3B82F6" stroke-opacity=".38"/><text class="p2-mono" x="298.0" y="339" text-anchor="middle" font-size="11.5" fill="#93C5FD">FastAPI</text></g><g class="p2-chip" style="animation-delay:1.36s"><rect x="344" y="322" width="69" height="26" rx="13" fill="#10203F" stroke="#3B82F6" stroke-opacity=".38"/><text class="p2-mono" x="378.5" y="339" text-anchor="middle" font-size="11.5" fill="#93C5FD">Docker</text></g><g class="p2-chip" style="animation-delay:1.48s"><rect x="421" y="322" width="47" height="26" rx="13" fill="#10203F" stroke="#3B82F6" stroke-opacity=".38"/><text class="p2-mono" x="444.5" y="339" text-anchor="middle" font-size="11.5" fill="#93C5FD">AWS</text></g><g class="p2-chip" style="animation-delay:1.60s"><rect x="476" y="322" width="69" height="26" rx="13" fill="#10203F" stroke="#3B82F6" stroke-opacity=".38"/><text class="p2-mono" x="510.5" y="339" text-anchor="middle" font-size="11.5" fill="#93C5FD">Locust</text></g><g class="p2-chip" style="animation-delay:1.72s"><rect x="553" y="322" width="76" height="26" rx="13" fill="#10203F" stroke="#3B82F6" stroke-opacity=".38"/><text class="p2-mono" x="591.0" y="339" text-anchor="middle" font-size="11.5" fill="#93C5FD">Grafana</text></g>
    </g>
    <g class="p2-in p2-d2">
        <g><rect x="880" y="40" width="270" height="44" rx="10" fill="#0F1B33" stroke="#3B82F6" stroke-opacity=".32"/>
        <text class="p2-mono" x="894" y="59" font-size="10.5" letter-spacing="1.4" fill="#93C5FD">REQUEST</text>
        <text class="p2-sans" x="894" y="75" font-size="12" fill="#9FB3D1">Transformer / LLM workload</text></g><path d="M1015.0 84 V98" stroke="#3B82F6" stroke-opacity=".5"/><path d="M1011.0 92 l4 6 l4 -6" fill="none" stroke="#3B82F6" stroke-opacity=".7"/>
        <g><rect x="880" y="98" width="270" height="44" rx="10" fill="#0F1B33" stroke="#3B82F6" stroke-opacity=".32"/>
        <text class="p2-mono" x="894" y="117" font-size="10.5" letter-spacing="1.4" fill="#93C5FD">DYNAMIC BATCHING</text>
        <text class="p2-sans" x="894" y="133" font-size="12" fill="#9FB3D1">group requests, keep latency low</text></g><path d="M1015.0 142 V156" stroke="#3B82F6" stroke-opacity=".5"/><path d="M1011.0 150 l4 6 l4 -6" fill="none" stroke="#3B82F6" stroke-opacity=".7"/>
        <g><rect x="880" y="156" width="270" height="44" rx="10" fill="#0F1B33" stroke="#3B82F6" stroke-opacity=".32"/>
        <text class="p2-mono" x="894" y="175" font-size="10.5" letter-spacing="1.4" fill="#93C5FD">ONNX RUNTIME</text>
        <text class="p2-sans" x="894" y="191" font-size="12" fill="#9FB3D1">FP32 · INT8 · FP16/BF16</text></g><path d="M1015.0 200 V214" stroke="#3B82F6" stroke-opacity=".5"/><path d="M1011.0 208 l4 6 l4 -6" fill="none" stroke="#3B82F6" stroke-opacity=".7"/>
        <g><rect x="880" y="214" width="270" height="44" rx="10" fill="#0F1B33" stroke="#3B82F6" stroke-opacity=".32"/>
        <text class="p2-mono" x="894" y="233" font-size="10.5" letter-spacing="1.4" fill="#93C5FD">FASTAPI SERVICE</text>
        <text class="p2-sans" x="894" y="249" font-size="12" fill="#9FB3D1">containerised, load-tested on AWS</text></g><path d="M1015.0 258 V272" stroke="#3B82F6" stroke-opacity=".5"/><path d="M1011.0 266 l4 6 l4 -6" fill="none" stroke="#3B82F6" stroke-opacity=".7"/>
        <g><rect x="880" y="272" width="270" height="44" rx="10" fill="#0F1B33" stroke="#93C5FD" stroke-opacity=".7"/>
        <text class="p2-mono" x="894" y="291" font-size="10.5" letter-spacing="1.4" fill="#93C5FD">PROMETHEUS + GRAFANA</text>
        <text class="p2-sans" x="894" y="307" font-size="12" fill="#9FB3D1">latency · throughput · errors</text></g><circle r="3.5" fill="#EFF6FF" filter="url(#p2-glowf)"><animateMotion dur="4.5s" repeatCount="indefinite" path="M866 62 V294"/></circle><path d="M866 62 V294" stroke="#3B82F6" stroke-opacity=".25" stroke-dasharray="2 5"/></g>
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#3B82F6" stroke-opacity=".22"/>
    <rect class="p2-trace" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#p2-trace)" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>

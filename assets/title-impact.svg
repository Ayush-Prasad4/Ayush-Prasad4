<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="02 IMPACT: Proof, in numbers.">
  <defs>
    <linearGradient id="ti-line" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="1160" y2="0">
      <stop offset="0" stop-color="#3B82F6"/><stop offset=".6" stop-color="#1D4ED8"/><stop offset="1" stop-color="#1D4ED8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ti-sheen" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#93C5FD"/><stop offset=".5" stop-color="#EFF6FF"/><stop offset="1" stop-color="#93C5FD"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1500 0;1500 0" keyTimes="0;.4;1" dur="7s" begin="1.5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="ti-pulse"><stop offset="0" stop-color="#EFF6FF"/><stop offset=".5" stop-color="#93C5FD" stop-opacity=".6"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .ti-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .ti-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .ti-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }

    .ti-in { animation: ti-in 1.1s cubic-bezier(.16,1,.3,1) both; }
    .ti-d2 { animation-delay: .2s; } .ti-d3 { animation-delay: .45s; }
    .ti-draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: ti-draw 1.8s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes ti-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes ti-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .ti-in { animation: none; } .ti-draw { animation: none; stroke-dashoffset: 0; } }
  </style>
  <g class="ti-in"><text class="ti-mono" x="40" y="34" font-size="12" letter-spacing="3" fill="#3B82F6"><tspan fill="#93C5FD">02</tspan>   IMPACT</text></g>
  <g class="ti-in ti-d2"><text class="ti-serif" x="38" y="84" font-size="44" font-weight="300" letter-spacing="-1" fill="#EFF6FF">Proof, in <tspan font-style="italic" fill="url(#ti-sheen)">numbers.</tspan></text></g>
  <g class="ti-in ti-d3"><text class="ti-mono" x="1160" y="34" text-anchor="end" font-size="10.5" letter-spacing="2.4" fill="#9FB3D1">MEASURED RESULTS</text></g>
  <path class="ti-draw" d="M40 106 H1160" stroke="url(#ti-line)" stroke-width="1"/>
  <circle cx="40" cy="106" r="7" fill="url(#ti-pulse)" opacity="0">
    <animate attributeName="cx" values="40;1160" dur="6s" begin="2.3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1"/>
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;.15;1" dur="6s" begin="2.3s" repeatCount="indefinite"/>
  </circle>
</svg>
